name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        run: make binaries TARGET=${{ matrix.goos }}/${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: generated/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  plugin-package:
    name: Package & Sign Plugin
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm 4
        uses: azure/setup-helm@v4
        with:
          version: 'v4.1.4'

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and sign plugin
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          # Create clean plugin directory with only what's needed
          mkdir -p plugin-staging/scripts
          cp plugin.yaml plugin-staging/
          cp scripts/install.sh plugin-staging/scripts/

          # Set version from tag
          sed -i "s/^version:.*/version: \"${VERSION}\"/" plugin-staging/plugin.yaml

          base64 -d <<< "${{ secrets.GPG_KEYRING_BASE64 }}" > secring.gpg
          helm plugin package --sign --key '${{ vars.SIGNING_KEY_EMAIL }}' --keyring secring.gpg plugin-staging
          rm -f secring.gpg
          ls -la in-pod-*.tgz in-pod-*.prov

      - name: Push to OCI registry
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE="in-pod-${VERSION}.tgz"
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helm-in-pod/in-pod"
          oras push "${REPO}:${VERSION}" \
            --artifact-type application/vnd.helm.plugin.v1+json \
            "$PACKAGE" \
            "$PACKAGE.prov"
          # Only tag stable releases as latest
          if ! echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            oras tag "${REPO}:${VERSION}" latest
          fi

      - name: Upload plugin tarball
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: |
            in-pod-*.tgz
            in-pod-*.tgz.prov
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    needs: [build, plugin-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: generated
          pattern: binary-*
          merge-multiple: true

      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: generated

      - name: Verify archives
        run: |
          echo "Release archives:"
          ls -lh generated/*.tar.gz generated/*.tgz generated/*.prov 2>/dev/null

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/*.tar.gz
            generated/*.tgz
            generated/*.prov
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
